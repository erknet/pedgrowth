[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pedgrowth-data-cdc"
version = "1.0.0"
description = "Optional cdc reference tables and plans for pedgrowth"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["SOURCE_RIGHTS.md", "R_PACKAGE_GPL_LICENSE.txt", "LICENSE"]
dependencies = ["pedgrowth==1.0.0"]

[project.entry-points."pedgrowth.references"]
cdc = "pedgrowth.data.cdc:register"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["pedgrowth.data.cdc*"]

[tool.setuptools.package-data]
"pedgrowth.data.cdc" = ["data/*.json", "py.typed"]
