name: Official growth-reference integrity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  verify-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install code-only official-source acquisition tools
        run: |
          python -m pip install -e './packages/pedgrowth[refresh]'
          python -m pip install -e ./packages/pedgrowth-data-who2006 -e ./packages/pedgrowth-data-who2007 -e ./packages/pedgrowth-data-cdc
      - name: Acquire and verify pinned WHO and CDC reference sources
        run: |
          python - <<'PY'
          from pedgrowth.data import download_missing_dependencies
          from pedgrowth.references import installed_references
          import warnings

          with warnings.catch_warnings(record=True) as captured:
              warnings.simplefilter("always", RuntimeWarning)
              results = download_missing_dependencies()
          assert not captured, [str(w.message) for w in captured]
          assert installed_references()["who2006"]
          assert installed_references()["who2007"]
          assert installed_references()["cdc"]
          assert all(results[name] >= 0 for name in ("who2006", "who2007", "cdc"))
          print("WHO and CDC original sources downloaded, normalized, and verified successfully")
          PY
