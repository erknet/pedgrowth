name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/pedgrowth/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './packages/pedgrowth[dev,pandas]'
          python -m pip install -e ./packages/pedgrowth-data-who2006 -e ./packages/pedgrowth-data-who2007 -e ./packages/pedgrowth-data-cdc -e ./packages/pedgrowth-data-intergrowth
      - name: Static analysis
        run: |
          python -m ruff check packages tests scripts
          python -m ruff format --check packages tests scripts
          python -m mypy
      - name: Reject source datasets staged for public Git publication
        run: python scripts/check_public_source.py --git-index
      - name: Data integrity and reference rights audit
        run: |
          if [ -f validation/source_data/who_bmi_for_age_boys.csv ]; then
            python scripts/refresh_data.py --check
          else
            echo "Reference CSV snapshots absent: using public code-only CI; private scientific validation remains separate."
          fi
          python scripts/verify_reference_rights.py
      - name: Regression and unit tests
        run: |
          if [ -f validation/source_data/who_bmi_for_age_boys.csv ]; then
            python -m pytest -q
          else
            python -m pytest -q tests/test_public_core.py
          fi

  cross-platform:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/pedgrowth/pyproject.toml
      - name: Install validated scientific extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './packages/pedgrowth[dev,pandas]'
          python -m pip install -e ./packages/pedgrowth-data-who2006 -e ./packages/pedgrowth-data-who2007 -e ./packages/pedgrowth-data-cdc -e ./packages/pedgrowth-data-intergrowth
      - name: Validate supported Python and platform
        run: |
          if [ -f validation/source_data/who_bmi_for_age_boys.csv ]; then
            python -m pytest -q
            python scripts/reproducibility_probe.py --output repro-probe.json
          else
            python -m pytest -q tests/test_public_core.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pedgrowth-repro-${{ runner.os }}-py${{ matrix.python-version }}
          path: repro-probe.json
          if-no-files-found: ignore
          retention-days: 30

  compare-cross-platform:
    if: ${{ vars.PEDGROWTH_SCIENTIFIC_CI == 'true' }}
    needs: [cross-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pedgrowth-repro-*
          path: .local/repro-ci
          merge-multiple: false
      - name: Fail on OS/version selection or numerical divergence
        run: python scripts/compare_reproducibility.py .local/repro-ci --require-full-matrix

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit optional runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install './packages/pedgrowth[vector,refresh,pandas]' pip-audit
          python -m pip_audit --local

  build:
    needs: [test, security, cross-platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip build 'setuptools>=77' wheel
      - name: Install local generic engine needed by the build verifier
        run: python -m pip install --no-deps -e ./packages/pedgrowth
      - name: Build public MIT core without private scientific files
        run: python scripts/build_distributions.py --mode publication --components core --output-dir .local/split-ci
      - name: Validate core wheel and source distribution
        run: |
          python scripts/check_wheel.py .local/split-ci/pedgrowth-*.whl
          python scripts/check_sdist.py .local/split-ci/pedgrowth-*.tar.gz
      - name: Validate source/code version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('packages/pedgrowth/pyproject.toml', 'rb'))['project']['version'])")
          python scripts/verify_release_version.py "$VERSION" --dist .local/split-ci
      - name: Test clean installed core without data or heavy dependencies
        run: |
          python -m venv /tmp/pedgrowth-clean
          /tmp/pedgrowth-clean/bin/python -m pip install --no-index --no-deps .local/split-ci/pedgrowth-*.whl
          (cd /tmp && /tmp/pedgrowth-clean/bin/python - <<'PYTEST'
          import importlib.util
          from pedgrowth import GrowthChartsCalculator, available_providers
          from pedgrowth.data import download_missing_dependencies
          assert available_providers() == ()
          assert download_missing_dependencies() == {}
          assert GrowthChartsCalculator is not None
          for name in ('numpy', 'scipy', 'pandas', 'rpy2'):
              assert importlib.util.find_spec(name) is None, name
          PYTEST
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pedgrowth-core-distributions
          # Upload only the MIT engine from routine CI. Provider wheels
          # were built for local QA but are not legally approved artifacts.
          path: |
            .local/split-ci/pedgrowth-*.whl
            .local/split-ci/pedgrowth-*.tar.gz
          if-no-files-found: error
          retention-days: 14
