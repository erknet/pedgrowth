# pedgrowth development monorepo - no installable distribution at the root.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.mypy]
explicit_package_bases = true
mypy_path = ["packages/pedgrowth/src", "packages/pedgrowth-data-who2006/src", "packages/pedgrowth-data-who2007/src", "packages/pedgrowth-data-cdc/src", "packages/pedgrowth-data-intergrowth/src"]
python_version = "3.11"
strict = true
files = ["packages/pedgrowth/src", "packages/pedgrowth-data-who2006/src", "packages/pedgrowth-data-who2007/src", "packages/pedgrowth-data-cdc/src", "packages/pedgrowth-data-intergrowth/src", "scripts"]
[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]
ignore = ["E741"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
